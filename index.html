<html>
  <head>
    <title>MASK STREAM</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial;
        color: white;
        text-align: center;
        background: linear-gradient(135deg, #000000, #1A0033, #330066, #6600CC);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
      }

      @keyframes gradientMove {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
      }

      .logo {
        width: 300px;
        margin-top: 40px;
        border-radius: 20px;
      }

      h1 {
        color: #FF00E6;
        font-size: 50px;
        margin-top: 20px;
      }

      p {
        font-size: 22px;
        color: #CCCCCC;
      }

      .btn {
        display: inline-block;
        padding: 15px 30px;
        margin: 10px;
        background: #6A00FF;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 20px;
        transition: 0.3s;
      }

      .btn:hover {
        background: #FF00E6;
      }
    </style>
  </head>

  <body>
    <!-- Poza ta -->
    <img src="https://raw.githubusercontent.com/sosoboso71/maskstream/main/MASK.jpeg" class="logo">

    <h1>MASK STREAM</h1>
    <p>Alerts & Overlays pentru TikTok LIVE</p>

    <a class="btn" href="login.html">Login</a>
    <a class="btn" href="register.html">Register</a>
  </body>
</html>
